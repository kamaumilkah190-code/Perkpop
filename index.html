
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perkpop - Create Account</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5efff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.container {
  background: white;
  padding: 30px 24px;
  border-radius: 20px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 8px 30px #0001;
}
h1 { color: #7928ca; text-align: center; }
p { text-align: center; color: #777; }
input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
}
button {
  width: 100%;
  padding: 15px;
  background: #7928ca;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 12px;
}
button:hover { background: #5e1da0; }
#message { color: #7928ca; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>💜 PERKPOP</h1>
  <p>Play • Complete Tasks • Earn Points</p>
  <h2>Create Your Account</h2>

  <form id="registerForm">
    <input id="name" placeholder="Full name" required>
    <input id="email" type="email" placeholder="Email address" required>
    <input id="phone" type="tel" placeholder="Phone number" required>
    <input id="password" type="password"
      placeholder="Create password" minlength="8" required>
    <button type="submit">Create Your Account</button>
  </form>

  <p id="message"></p>
  <p>Already have an account? <a href="#" id="login">Log in</a></p>
</div>

<script>
document.getElementById("registerForm")
.addEventListener("submit", function(event) {
  event.preventDefault();
  document.getElementById("message").textContent =
  "Registration design ready! Connect Firebase to create secure accounts.";
});
document.getElementById("login").addEventListener("click", function(event) {
  event.preventDefault();
  document.getElementById("message").textContent =
  "Login will be available after Firebase setup.";
});
</script>
</body>
</html>
